version: '3.8'

services:
  # Backend API Service
  patient-scheduler-restapi:
    build:
      context: ./patient-scheduler-restapi
      dockerfile: Dockerfile
    container_name: patient-scheduler-restapi
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - patient-scheduler-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Angular Service
  patient-scheduler-webui:
    build:
      context: ./patient-scheduler-webui
      dockerfile: Dockerfile
    container_name: patient-scheduler-webui
    ports:
      - "4200:80"
    # depends_on:
    #   patient-scheduler-restapi:
    #     condition: service_healthy
    networks:
      - patient-scheduler-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  patient-scheduler-network:
    driver: bridge
